<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>VitaBalance: Guardianes de las Estaciones</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #1a1a2e;
        overscroll-behavior: none;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
                 env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      }
      #game-container {
        width: 100%;
        max-width: 1280px;
        position: relative;
      }
      #game-container canvas {
        display: block;
        touch-action: none;
      }
      /* Accessible overlay — positioned over the canvas for screen readers */
      #a11y-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
      }
      #a11y-layer button {
        position: absolute;
        pointer-events: auto;
        background: transparent;
        border: none;
        color: transparent;
        font-size: 0;
        cursor: pointer;
        min-width: 44px;
        min-height: 44px;
        outline: none;
      }
      #a11y-layer button:focus-visible {
        outline: 3px solid #ffcc00;
        outline-offset: 2px;
        border-radius: 8px;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div id="a11y-layer" aria-label="Controles del menú"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
